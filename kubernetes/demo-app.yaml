apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: infrastructure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      automountServiceAccountToken: false
      containers:
        - name: payment
          image: infrastructure-debugger/payment:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: infrastructure-demo
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: infrastructure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      automountServiceAccountToken: false
      containers:
        - name: checkout
          image: infrastructure-debugger/checkout:v1
          imagePullPolicy: Never
          env:
            - name: PAYMENT_URL
              value: http://payment:8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: infrastructure-demo
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: infrastructure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: infrastructure-debugger/frontend:v1
          imagePullPolicy: Never
          env:
            - name: CHECKOUT_URL
              value: http://checkout:8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: infrastructure-demo
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
